syntax = "proto3";

package bsos;

option go_package = "github.com/echo983/BSOS/internal/daemon/bsospb";

// See docs/DESIGN.md §4 for the rationale behind this shape.
// gRPC only — there is no HTTP surface for this service.

message PutHeader {
  uint64 fid = 1;         // client-computed xxh3_64(content); server trusts it, never verifies
  uint64 total_size = 2;  // required; must arrive before any data chunk
  uint64 alias_for = 3;   // optional, 0 = normal put. Non-zero: also register
                           // alias_for -> fid as a one-hop jump pointer, in
                           // the same write.
}

message PutRequest {
  oneof msg {
    PutHeader header = 1;  // must be the first message on the stream
    bytes chunk = 2;       // subsequent messages, streamed straight to disk
  }
}

message PutResponse {}

message GetRequest {
  uint64 fid = 1;
  bool has_range = 2;
  uint64 range_start = 3;
  uint64 range_end = 4;
}

message GetResponse {
  uint64 size = 1;
  uint64 range_start = 2;
  uint64 range_end = 3;
  bytes data = 4;
}

message HeadRequest {
  uint64 fid = 1;
}

message HeadResponse {
  uint64 size = 1;
}

message Empty {}

message BonnieResponse {
  uint32 ch_d_pow2 = 1;  // largest object size placeable with the
                          // configured target probability, right now
}

message HealthResponse {
  bool ok = 1;
}

message ChunkDescriptor {
  uint64 fid = 1;         // chunk logical FID (xxh3_64)
  uint64 target_fid = 2;  // chunk physical FID (non-zero if jumped)
  uint64 offset = 3;      // byte offset within original file
  uint64 size = 4;        // chunk byte length
  uint32 jumps_taken = 5; // number of jumps taken (0 = direct)
}

message FileManifest {
  uint32 version = 1;           // manifest format version (currently 1)
  uint64 total_size = 2;        // total original file size in bytes
  uint64 full_content_hash = 3; // xxh3_64 of the entire reassembled file
  string filename = 4;          // optional original filename
  uint64 chunk_target_size = 5; // configured CDC target chunk size
  repeated ChunkDescriptor chunks = 6;
}

service BSOS {
  rpc Put(stream PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (stream GetResponse);
  rpc Head(HeadRequest) returns (HeadResponse);
  rpc Bonnie(Empty) returns (BonnieResponse);
  rpc Health(Empty) returns (HealthResponse);
}
